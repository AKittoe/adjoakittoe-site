name: Sync from Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Photo resizer
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Pull from Notion
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Save changes
        run: |
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          git add -A data assets || true
          if git diff --cached --quiet; then
            echo "Nothing changed in Notion."
          else
            git commit -m "Sync from Notion"
            git push
          fi
